# netlify.toml
# IMPORTANT: This replaces any previous netlify.toml in the repo root.
# The Edge Function approach has been replaced by a build-time static generator.

[build]
  publish = "."
  command = "echo 'Static site — no build command needed'"

# ── Local Netlify Build Plugin ─────────────────────────────────────────────────
# Reads content/blog/*.md and outputs static HTML to /blog/ at every deploy.
[[plugins]]
  package = "./netlify/plugins/generate-blog"

# ── Redirects ──────────────────────────────────────────────────────────────────
# /blog        → /blog/index.html  (serve the generated index)
# /blog/*      → /blog/*/index.html (serve individual article pages)
# These rules are only needed as a safety net — Netlify serves index.html
# automatically for directory requests, so they may not be strictly required.

[[redirects]]
  from   = "/blog"
  to     = "/blog/index.html"
  status = 200

[[redirects]]
  from   = "/blog/"
  to     = "/blog/index.html"
  status = 200

# ── Headers ────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
