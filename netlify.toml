# netlify.toml
# UK Rugby Club Directory — Netlify configuration

[build]
  publish = "."
  command = "echo 'No build command — plugin handles blog generation'"

# ─── Blog generation plugin ───────────────────────────────────────────────────
# Runs at pre-build, reads content/blog/*.md, writes static /blog/ HTML files.
# This replaces the old Edge Function approach entirely.
[[plugins]]
  package = "./netlify/plugins/generate-blog"

# ─── Redirects ────────────────────────────────────────────────────────────────
# /blog → /blog/index.html (clean URL)
[[redirects]]
  from   = "/blog"
  to     = "/blog/index.html"
  status = 200

# /blog/:slug → /blog/:slug/index.html (clean article URLs)
[[redirects]]
  from   = "/blog/:slug"
  to     = "/blog/:slug/index.html"
  status = 200

# ─── Headers ─────────────────────────────────────────────────────────────────
# Static HTML files — short cache with revalidation
[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# JSON assets (index.json kept for backwards compat in case anything reads it)
[[headers]]
  for = "/content/blog/*.json"
  [headers.values]
    Content-Type  = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# ─── Edge Functions (DISABLED — remove these lines if you have them) ──────────
# The old edge function approach is replaced by the build plugin above.
# If you have an [edge_functions] section, delete it.
